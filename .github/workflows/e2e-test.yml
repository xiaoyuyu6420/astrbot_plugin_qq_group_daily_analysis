name: E2E Tests

on:
  push:
    branches: [xms]
  pull_request:
    branches: [xms]
  workflow_dispatch:

jobs:
  # ── 集成测试：mock astrbot，快速验证业务逻辑 ──
  integration-test:
    name: Integration Tests (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          python -m pytest tests/test_monitor_e2e.py -v --asyncio-mode=auto --tb=short

  # ── 半真 e2e：真实 astrbot，验证 filter 注册 + 拦截匹配 ──
  real-e2e-test:
    name: Real E2E Tests (astrbot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install astrbot + plugin deps + test deps
        run: |
          python -m pip install --upgrade pip
          # 真实 astrbot 框架（体积较大，约 2-3 分钟）
          pip install astrbot
          # 插件自身依赖
          pip install -r requirements.txt
          # 测试依赖
          pip install pytest pytest-asyncio

      - name: Verify astrbot importable
        run: |
          python -c "import astrbot; print('astrbot version:', astrbot.__version__)"

      - name: Run real e2e tests
        run: |
          python -m pytest tests/real_e2e/test_monitor_real_e2e.py -v --asyncio-mode=auto --tb=short

      - name: Show test summary on failure
        if: failure()
        run: |
          echo "::error::Real E2E tests failed. Check filter registration or handler wiring."
          python -m pytest tests/real_e2e/test_monitor_real_e2e.py --asyncio-mode=auto -v --tb=long 2>&1 | tail -50
