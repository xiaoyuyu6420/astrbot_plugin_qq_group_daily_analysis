name: E2E Tests

on:
  push:
    branches: [xms]
  pull_request:
    branches: [xms]
  workflow_dispatch:

jobs:
  # ── 集成 / 单元测试：纯 mock，不依赖真实 astrbot 框架 ──
  # 关键：故意不安装 astrbot —— tests/conftest.py 检测到无真实框架时会自动注入 mock。
  # 若装了 astrbot，conftest 不 mock，部分测试会因真实框架行为不一致而失败。
  integration-test:
    name: Integration Tests (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 故意不装 astrbot 本体 —— tests/conftest.py 检测到无真实框架时会自动注入 mock。
          # 但导入链需要的间接依赖必须显式补齐，否则 collection 阶段就失败：
          #   - lark_adapter.py     → aiohttp
          #   - response_validation → pydantic
          #   - generators.py       → jinja2 (含 markupsafe)
          pip install aiohttp pydantic jinja2
          pip install pytest pytest-asyncio

      - name: Run integration tests
        run: |
          python -m pytest tests/ -v --asyncio-mode=auto --tb=short --ignore=tests/real_e2e

      - name: Show test summary on failure
        if: failure()
        run: |
          echo "::error::Integration tests failed. Re-run with long traceback:"
          python -m pytest tests/ --asyncio-mode=auto --ignore=tests/real_e2e -v --tb=long 2>&1 | tail -80

  # ── 半真 e2e：真实 astrbot，验证 filter 注册 + 拦截匹配 ──
  real-e2e-test:
    name: Real E2E Tests (astrbot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install astrbot + plugin deps + test deps
        run: |
          python -m pip install --upgrade pip
          pip install astrbot
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify astrbot importable
        run: |
          python -c "import astrbot; print('astrbot version:', astrbot.__version__)"

      - name: Run real e2e tests
        run: |
          python -m pytest tests/real_e2e/test_monitor_real_e2e.py -v --asyncio-mode=auto --tb=short

      - name: Show test summary on failure
        if: failure()
        run: |
          echo "::error::Real E2E tests failed. Check filter registration or handler wiring."
          python -m pytest tests/real_e2e/test_monitor_real_e2e.py --asyncio-mode=auto -v --tb=long 2>&1 | tail -50

